services:
  # 🤖 Service 1: Telegram Bot + Admin Panel
  - type: web
    name: torbox-tg-bot
    env: node
    region: oregon
    plan: free
    rootDir: tgbot
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TORBOX_API_KEY
        sync: false
      - key: BOT_ADMIN_ID
        sync: false
      - key: ADMIN_WEB_USERNAME
        value: admin
      - key: ADMIN_WEB_PASSWORD
        sync: false
      - key: ALLOWED_USERS
        sync: false
      - key: TORBOX_API_BASE
        value: https://api.torbox.app
      - key: TORBOX_API_VERSION
        value: v1
      - key: MONITOR_INTERVAL_MS
        value: "60000"
      - key: PAGE_SIZE
        value: "5"

  # 🌐 Service 2: Next.js Web UI
  - type: web
    name: torbox-web-ui
    env: node
    region: oregon
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: WEB_USERNAME
        value: admin
      - key: WEB_PASSWORD
        sync: false
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: NODE_ENV
        value: production
