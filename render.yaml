services:
  # 🚀 ALL-IN-ONE SINGLE SERVICE: Web UI + Telegram Bot
  - type: web
    name: torbox-all-in-one
    env: node
    region: oregon
    plan: free
    buildCommand: npm install --include=dev && cd tgbot && npm install && cd .. && npm run build
    startCommand: node scripts/start-all.js
    envVars:
      # ── Telegram Bot ─────────────────────────────────────────
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TORBOX_API_KEY
        sync: false
      - key: BOT_ADMIN_ID
        sync: false
      - key: ADMIN_WEB_USERNAME
        value: admin
      - key: ADMIN_WEB_PASSWORD
        sync: false
      - key: ALLOWED_USERS
        sync: false
      - key: TORBOX_API_BASE
        value: https://api.torbox.app
      - key: TORBOX_API_VERSION
        value: v1
      - key: MONITOR_INTERVAL_MS
        value: "60000"
      - key: PAGE_SIZE
        value: "5"

      # ── Next.js Web UI ───────────────────────────────────────
      - key: WEB_USERNAME
        value: admin
      - key: WEB_PASSWORD
        sync: false
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: NODE_ENV
        value: production
